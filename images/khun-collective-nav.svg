  <!-- Wordmark -->
  <text x="56" y="22" font-family="'DM Sans','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#2b3a4a" text-anchor="start">KHUN</text>
  <text x="57" y="38" font-family="'DM Sans','Helvetica Neue',Arial,sans-serif" font-size="8.5" font-weight="500" letter-spacing="4.5" fill="#2b3a4a" text-anchor="start">COLLECTIVE</text>
