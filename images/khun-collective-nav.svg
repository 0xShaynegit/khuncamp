  <rect x="0" y="2" width="44" height="44" fill="#2b3a4a"/>
  <rect x="8" y="9" width="10" height="30" fill="white"/>
  <rect x="18" y="9" width="1.5" height="30" fill="#2b3a4a"/>
  <polygon points="19.5,9 40,9 40,19 19.5,21" fill="white"/>
